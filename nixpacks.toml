[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "npm install",
  "cd apps/api && npm install"
]

[phases.build]
cmds = [
  "cd apps/api",
  "npx prisma generate --schema=./prisma/schema.prisma || echo 'Prisma generate failed'",
  "npm run build || (echo 'Build failed' && exit 1)",
  "pwd",
  "ls -la",
  "ls -la dist/ || echo 'dist directory does not exist'",
  "test -f dist/main.js && echo 'main.js exists' || echo 'main.js NOT FOUND'"
]

[start]
cmd = "cd apps/api && pwd && ls -la && test -f dist/main.js && node dist/main.js || (echo 'ERROR: dist/main.js not found' && ls -la dist/ && exit 1)"
