[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "npm install",
  "cd apps/api && npm install"
]

[phases.build]
cmds = [
  "cd apps/api",
  "npx prisma generate --schema=./prisma/schema.prisma",
  "npm run build",
  "ls -la dist || echo 'Build failed - dist directory not found'"
]

[start]
cmd = "cd apps/api && ls -la dist && node dist/main.js"
