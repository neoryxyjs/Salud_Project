[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "npm install",
  "cd apps/api && npm install"
]

[phases.build]
cmds = [
  "cd apps/api",
  "echo 'Current directory:' && pwd",
  "echo 'Installing dependencies...'",
  "npm install",
  "echo 'Generating Prisma Client...'",
  "npx prisma generate --schema=./prisma/schema.prisma",
  "echo 'Building NestJS application...'",
  "npm run build",
  "echo 'Build completed. Checking dist directory...'",
  "pwd",
  "ls -la",
  "ls -la dist/ || (echo 'ERROR: dist directory does not exist' && exit 1)",
  "test -f dist/main.js && echo 'SUCCESS: main.js exists' || (echo 'ERROR: main.js NOT FOUND' && ls -la dist/ && exit 1)"
]

[start]
cmd = "cd apps/api && pwd && ls -la && test -f dist/main.js && node dist/main.js || (echo 'ERROR: dist/main.js not found' && ls -la dist/ && exit 1)"
